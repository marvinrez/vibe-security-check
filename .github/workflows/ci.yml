name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Plugin and marketplace manifests agree with the tree
        run: |
          python3 - <<'PY'
          import json, pathlib

          plugin = json.loads(pathlib.Path(".claude-plugin/plugin.json").read_text())
          market = json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text())

          entries = [e for e in market["plugins"] if e["name"] == plugin["name"]]
          assert entries, f"marketplace.json has no entry for {plugin['name']!r}"
          entry = entries[0]
          assert entry["source"] == "./", f"root plugin must be sourced from ./, got {entry['source']!r}"
          assert entry.get("version") == plugin.get("version"), (
              f"version drift: plugin.json {plugin.get('version')!r} vs marketplace entry {entry.get('version')!r}")

          # A plugin with no `skills` field loads skills/ — so the directory is the contract.
          assert "skills" not in plugin, "plugin.json overrides the default skills/ path; update this check"
          shipped = sorted(d.name for d in pathlib.Path("skills").iterdir() if (d / "SKILL.md").exists())
          assert shipped, "no skills would be discovered"
          print(f"ok: {plugin['name']} {plugin.get('version')} ships {len(shipped)} skills: {', '.join(shipped)}")
          PY

      - name: Manifests pass claude plugin validate --strict
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s latest
          export PATH="$HOME/.local/bin:$PATH"
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate . --strict

      - name: Every skill has valid frontmatter
        run: |
          python3 - <<'PY'
          import re, yaml, pathlib
          skills = sorted(p for p in pathlib.Path("skills").iterdir() if p.is_dir())
          assert skills, "no skills found"
          for d in skills:
              p = d / "SKILL.md"
              assert p.exists(), f"{d} has no SKILL.md"
              m = re.match(r"^---\n(.*?)\n---\n", p.read_text(), re.S)
              assert m, f"{p}: no YAML frontmatter"
              f = yaml.safe_load(m.group(1))
              for k in ("name", "description", "license"):
                  assert f.get(k), f"{p}: missing {k}"
              assert f["name"] == d.name, f"{p}: name {f['name']!r} != directory {d.name!r}"
              print(f"ok: {f['name']}, description {len(f['description'])} chars")
          PY

      - name: Every reference a skill routes to exists
        run: |
          python3 - <<'PY'
          import re, pathlib
          for d in sorted(p for p in pathlib.Path("skills").iterdir() if p.is_dir()):
              refs = set(re.findall(r"references/([a-z-]+\.md)", (d / "SKILL.md").read_text()))
              missing = [r for r in refs if not (d / "references" / r).exists()]
              assert not missing, f"{d.name}/SKILL.md routes to missing files: {missing}"
              orphans = [f.name for f in sorted((d / "references").glob("*.md")) if f.name not in refs]
              assert not orphans, f"{d.name} has references nothing routes to: {orphans}"
              print(f"ok: {d.name}, {len(refs)} references, all present and all reachable")
          PY

      - name: Scripts parse and are executable
        run: |
          for f in skills/vibe-security-check/scripts/*.sh skills/vibe-security-check/scripts/tests/*.sh; do
            bash -n "$f"
            [ -x "$f" ] || { echo "not executable: $f"; exit 1; }
          done

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning skills/vibe-security-check/scripts/*.sh \
                                skills/vibe-security-check/scripts/tests/*.sh

      - name: Scripts behave — findings, clean passes, and unreachable hosts
        run: skills/vibe-security-check/scripts/tests/run.sh

      - name: Every Semgrep rule fires on a vulnerable fixture and none on a safe one
        run: |
          pip install --quiet semgrep
          cd skills/vibe-security-check
          # Semgrep's default ignore list skips directories named tests/, so the
          # fixtures are passed one file at a time rather than as a directory.
          scan() {
            semgrep --config rules/vibe-security.yaml --metrics=off \
                    --disable-version-check --no-git-ignore --quiet "$1" --json
          }
          OUT=$(mktemp -d); export OUT
          scan rules/tests/vulnerable.ts > "$OUT/vuln-ts.json"
          scan rules/tests/vulnerable.py > "$OUT/vuln-py.json"
          scan rules/tests/safe.ts       > "$OUT/safe-ts.json"
          scan rules/tests/safe.py       > "$OUT/safe-py.json"
          python3 - <<'PY'
          import json, os, re, pathlib, sys

          out = os.environ["OUT"]
          defined = set(re.findall(r"^  - id: (\S+)", pathlib.Path("rules/vibe-security.yaml").read_text(), re.M))

          def ids(name):
              with open(f"{out}/{name}.json") as fh:
                  return {r["check_id"].split(".")[-1] for r in json.load(fh)["results"]}

          fired = ids("vuln-ts") | ids("vuln-py")
          quiet = ids("safe-ts") | ids("safe-py")

          ok = True
          uncovered = sorted(defined - fired)
          if uncovered:
              print(f"rules with no vulnerable fixture: {uncovered}"); ok = False
          unknown = sorted(fired - defined)
          if unknown:
              print(f"findings from rules not in the file: {unknown}"); ok = False
          if quiet:
              print(f"false positives on the safe fixtures: {sorted(quiet)}"); ok = False
          if ok:
              print(f"ok: all {len(defined)} rules fire on a vulnerable fixture, 0 on the safe ones")
          sys.exit(0 if ok else 1)
          PY
