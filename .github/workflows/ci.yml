name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Every skill has valid frontmatter
        run: |
          python3 - <<'PY'
          import re, yaml, pathlib
          skills = sorted(p for p in pathlib.Path("skills").iterdir() if p.is_dir())
          assert skills, "no skills found"
          for d in skills:
              p = d / "SKILL.md"
              assert p.exists(), f"{d} has no SKILL.md"
              m = re.match(r"^---\n(.*?)\n---\n", p.read_text(), re.S)
              assert m, f"{p}: no YAML frontmatter"
              f = yaml.safe_load(m.group(1))
              for k in ("name", "description", "license"):
                  assert f.get(k), f"{p}: missing {k}"
              assert f["name"] == d.name, f"{p}: name {f['name']!r} != directory {d.name!r}"
              print(f"ok: {f['name']}, description {len(f['description'])} chars")
          PY

      - name: Every reference a skill routes to exists
        run: |
          python3 - <<'PY'
          import re, pathlib
          for d in sorted(p for p in pathlib.Path("skills").iterdir() if p.is_dir()):
              refs = set(re.findall(r"references/([a-z-]+\.md)", (d / "SKILL.md").read_text()))
              missing = [r for r in refs if not (d / "references" / r).exists()]
              assert not missing, f"{d.name}/SKILL.md routes to missing files: {missing}"
              orphans = [f.name for f in sorted((d / "references").glob("*.md")) if f.name not in refs]
              assert not orphans, f"{d.name} has references nothing routes to: {orphans}"
              print(f"ok: {d.name}, {len(refs)} references, all present and all reachable")
          PY

      - name: Scripts parse and are executable
        run: |
          for f in skills/vibe-security-check/scripts/*.sh; do
            bash -n "$f"
            [ -x "$f" ] || { echo "not executable: $f"; exit 1; }
          done

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning skills/vibe-security-check/scripts/*.sh

      - name: Semgrep rules fire on vulnerable fixtures and stay quiet on safe ones
        run: |
          pip install --quiet semgrep
          cd skills/vibe-security-check
          for f in rules/tests/vulnerable.ts rules/tests/vulnerable.py; do
            n=$(semgrep --config rules/vibe-security.yaml --metrics=off --disable-version-check \
                --no-git-ignore --quiet "$f" --json | python3 -c "import json,sys;print(len(json.load(sys.stdin)['results']))")
            [ "$n" -gt 0 ] || { echo "no findings on $f — rules are broken"; exit 1; }
            echo "ok: $n findings on $f"
          done
          for f in rules/tests/safe.ts rules/tests/safe.py; do
            n=$(semgrep --config rules/vibe-security.yaml --metrics=off --disable-version-check \
                --no-git-ignore --quiet "$f" --json | python3 -c "import json,sys;print(len(json.load(sys.stdin)['results']))")
            [ "$n" -eq 0 ] || { echo "$n false positives on $f"; exit 1; }
            echo "ok: 0 false positives on $f"
          done
