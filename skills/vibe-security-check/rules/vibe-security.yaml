# Semgrep rules for patterns specific to AI-generated application code.
#
# Deliberately narrow. Generic rulesets already cover injection and the classic
# OWASP shapes; what they miss are the mistakes a model makes when it optimises
# for "the feature works" — reaching for the key that bypasses rules, trusting a
# value the client sent, verifying a signature against the wrong body.
#
#   semgrep --config rules/vibe-security.yaml .
#
# Written for this project. No rule here is derived from another ruleset.
#
# Fixtures in rules/tests/ pin the behaviour line by line: each line a rule must
# fire on carries a "ruleid:" comment above it, a vulnerable fixture may produce
# no finding that is not annotated, and a safe one may produce none at all.
# rules/tests/check.py enforces that, and CI runs it. Semgrep's default ignore
# list skips directories named tests/, so the fixtures are scanned one file at a
# time rather than as a directory.
#
# The three rules about values the client sent are taint rules, so they follow
# the value through destructuring, `await req.json()` and arithmetic. Taint stops
# at a lookup in an UPPER_CASE table (an allowlist) and at a find or retrieve
# call (the record the server looked up). Semgrep's free engine follows data
# within one function only.

rules:
  - id: service-role-key-outside-server
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Service-role or admin key referenced in code that may reach the browser. This key bypasses
      every row-level rule, so one copy in a bundle is total database compromise. Keep it in
      server-only code, and fix the permission rule rather than escalating past it.
    patterns:
      - pattern-either:
          - pattern: "process.env.$KEY"
          - pattern: "import.meta.env.$KEY"
      - metavariable-regex:
          metavariable: $KEY
          regex: .*(SERVICE_ROLE|SERVICE_KEY|ADMIN_KEY|FIREBASE_ADMIN|SUPABASE_SECRET).*
    paths:
      exclude:
        - "**/api/**"
        - "**/server/**"
        - "**/*.server.*"
        - "**/route.ts"
        - "**/route.js"
        - "**/functions/**"

  - id: public-prefixed-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A secret-looking name exposed through a public environment prefix. Anything prefixed
      NEXT_PUBLIC_, VITE_, EXPO_PUBLIC_ or REACT_APP_ is compiled into the browser bundle as plain
      text, and a model provider's API key there lets anyone spend on your account. Move it
      server-side and have the browser call your own route.
    patterns:
      - pattern-either:
          - pattern: "process.env.$KEY"
          - pattern: "import.meta.env.$KEY"
      # Secret, password and private-key names are always findings. API keys and tokens are,
      # except for the services whose client keys are public by design.
      - metavariable-regex:
          metavariable: $KEY
          regex: ^(NEXT_PUBLIC|VITE|EXPO_PUBLIC|REACT_APP)_(.*(SECRET|SERVICE_ROLE|PRIVATE|PASSWORD).*|(?!.*(PUBLISHABLE|ANON|PUBLIC|SITE|SEARCH|FIREBASE|MAPS|MAPBOX|POSTHOG|SENTRY|ALGOLIA|CLERK|MEASUREMENT|REVENUECAT|ONESIGNAL|AMPLITUDE|SEGMENT|MIXPANEL|PUSHER)).*(API_KEY|APIKEY|ACCESS_KEY|AUTH_TOKEN|ACCESS_TOKEN).*)$

  - id: cost-parameter-from-client
    languages: [javascript, typescript]
    severity: ERROR
    mode: taint
    message: >-
      A cost parameter taken from the request. An attacker swaps the cheap model for the most
      expensive one, or sets the token limit to its maximum, inside a perfectly authenticated
      request — so no permission check notices. Set these on the server, or map the client's
      choice onto an allowlist.
    pattern-sources: &request-sources
      - patterns:
          - pattern-either:
              - pattern: $R.body
              - pattern: $R.query
          - metavariable-regex:
              metavariable: $R
              regex: ^(.*[Rr]eq(uest)?|event)$
      - patterns:
          - pattern-either:
              - pattern: await $R.json()
              - pattern: await $R.formData()
          - metavariable-regex:
              metavariable: $R
              regex: ^.*[Rr]eq(uest)?$
    pattern-sanitizers: &server-lookups
      - patterns:
          - pattern: $TABLE[$K]
          - metavariable-regex:
              metavariable: $TABLE
              regex: ^[A-Z][A-Z0-9_]*$
      - patterns:
          - pattern: $X.$FIND(...)
          - metavariable-regex:
              metavariable: $FIND
              regex: ^(find|findOne|findUnique|findFirst|findById|findByPk|retrieve|lookup)$
    pattern-sinks:
      - patterns:
          - pattern-inside: "{..., $PARAM: $V, ...}"
          # The destructuring that pulls the value out of the request is not a use of it.
          - pattern-not-inside: "$P = $R.body"
          - pattern-not-inside: "$P = $R.query"
          - pattern-not-inside: "$P = await $R.json()"
          - metavariable-regex:
              metavariable: $PARAM
              regex: ^(model|max_tokens|maxTokens|maxOutputTokens|max_completion_tokens|max_output_tokens)$
          - focus-metavariable: $V

  - id: price-from-client
    languages: [javascript, typescript]
    severity: ERROR
    mode: taint
    message: >-
      A charge amount taken from the request. The browser can post any number. Look the price up
      server-side from an item identifier instead.
    pattern-sources: *request-sources
    pattern-sanitizers: *server-lookups
    pattern-sinks:
      - patterns:
          - pattern-inside: "{..., $PARAM: $V, ...}"
          - pattern-not-inside: "$P = $R.body"
          - pattern-not-inside: "$P = $R.query"
          - pattern-not-inside: "$P = await $R.json()"
          - metavariable-regex:
              metavariable: $PARAM
              regex: ^(amount|unit_amount|unit_amount_decimal)$
          - focus-metavariable: $V

  - id: mass-assignment-from-body
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A whole request body passed into a write. If the model has a role, tenant or credit field,
      the client can set it. Use an explicit allowlist of writable fields per endpoint.
    pattern-either:
      # The body itself, or the body spread into the object being written.
      - patterns:
          - pattern-either: &writes
              - pattern: $M.update($B, ...)
              - pattern: $M.create($B, ...)
              - pattern: $M.insert($B, ...)
              - pattern: $M.upsert($B, ...)
              - pattern: $M.updateOne($X, $B, ...)
              - pattern: $M.updateMany($X, $B, ...)
              - pattern: $M.findByIdAndUpdate($X, $B, ...)
              - pattern: $M.findOneAndUpdate($X, $B, ...)
              - pattern: $M.set($B)
              - patterns:
                  - pattern: "$M.$OP({..., data: $B, ...})"
                  - metavariable-regex:
                      metavariable: $OP
                      regex: ^(create|createMany|update|updateMany|upsert)$
          - metavariable-regex:
              metavariable: $B
              regex: ^([\w.]*\.body$|\{[\s\S]*\.\.\.\s*[\w.]*\.body\b)
      # A variable holding the body.
      - patterns:
          - pattern-either: *writes
          - pattern-either:
              - pattern-inside: |
                  $B = $R.body;
                  ...
              - pattern-inside: |
                  $B = await $R.json();
                  ...
              - pattern-inside: |
                  $B = JSON.parse($R.body);
                  ...
          - metavariable-regex:
              metavariable: $R
              regex: ^(.*[Rr]eq(uest)?|event)$

  - id: raw-html-with-variable
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Raw HTML injection with a non-literal value. Frameworks escape by default, so this is an
      explicit opt-out and needs both a reason and a sanitizer. Confirm the value cannot carry user
      input or model output, or pass it through DOMPurify first.
    patterns:
      - pattern-either:
          - pattern: "$EL.innerHTML = $V"
          - pattern: "$EL.outerHTML = $V"
          - pattern: "$EL.insertAdjacentHTML($POS, $V)"
          - pattern: "document.write($V)"
          # React's dangerouslySetInnerHTML={{ __html: ... }}
          - pattern: "{..., __html: $V, ...}"
      # Not a literal, and not already passed through a sanitizer.
      - metavariable-regex:
          metavariable: $V
          regex: ^(?!("[^"]*"|'[^']*'|`[^`$]*`)$)(?!(DOMPurify|dompurify|purify)\.sanitize\(|sanitizeHtml\()

  - id: tls-verification-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      TLS verification disabled. Usually added to make a self-signed certificate work locally and
      never removed. Point the client at the CA bundle instead of switching the check off.
    pattern-either:
      - pattern: 'process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"'
      - pattern: "{..., rejectUnauthorized: false, ...}"

  - id: tls-verification-disabled-python
    languages: [python]
    severity: ERROR
    message: >-
      TLS verification disabled. Point the client at the CA bundle instead of switching the check
      off — verify accepts a path.
    pattern-either:
      - pattern: "$R.get(..., verify=False, ...)"
      - pattern: "$R.post(..., verify=False, ...)"
      - pattern: "$R.request(..., verify=False, ...)"
      - pattern: "$S.verify = False"

  - id: webhook-signature-against-parsed-body
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Webhook signature verified against a parsed body. Verification must run on the raw bytes;
      once a JSON parser has touched them the signature cannot match, and the usual workaround is
      to stop verifying. In Express, mount this route with express.raw() so req.body is the raw
      buffer; in a Next.js route handler, pass await req.text().
    patterns:
      - pattern-either:
          - pattern: $S.webhooks.constructEvent(JSON.stringify(...), ...)
          - pattern: $S.webhooks.constructEventAsync(JSON.stringify(...), ...)
          - patterns:
              - pattern-either:
                  - pattern: $S.webhooks.constructEvent($R.body, ...)
                  - pattern: $S.webhooks.constructEventAsync($R.body, ...)
              # Stripe's documented Express handler: the route parses nothing.
              - pattern-not-inside: $APP.$METHOD(..., express.raw(...), ...)
              - pattern-not-inside: $APP.$METHOD(..., bodyParser.raw(...), ...)

  - id: jwt-decoded-without-verification
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A token decoded without verifying its signature, in server code. decode() reads the claims of
      anything, including a token the attacker wrote. Verify it with the secret or public key
      (jwt.verify, or jose's jwtVerify) before trusting a claim. Reading your own token's expiry in
      the browser is fine; an authorization decision is not.
    pattern-either:
      # jsonwebtoken runs on the server.
      - pattern: jwt.decode($T)
      # jwt-decode is a browser library; it is a finding where it makes a server's decision.
      - patterns:
          - pattern: jwtDecode($T)
          - pattern-either:
              - pattern-inside: |
                  export function middleware(...) { ... }
              - pattern-inside: |
                  export async function middleware(...) { ... }
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          export function $HANDLER(...) { ... }
                      - pattern-inside: |
                          export async function $HANDLER(...) { ... }
                  - metavariable-regex:
                      metavariable: $HANDLER
                      regex: ^(GET|POST|PUT|PATCH|DELETE)$
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          ($REQ, $RES, ...) => { ... }
                      - pattern-inside: |
                          function $F($REQ, $RES, ...) { ... }
                  - metavariable-regex:
                      metavariable: $REQ
                      regex: ^(req|request)$

  - id: permissive-cors-with-credentials
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Credentials allowed for any origin. origin: true, or a callback that always says yes, reflects
      whatever Origin the request sends, so every site can make credentialed requests and read the
      answer. "*" with credentials is refused by browsers, so it only breaks the app — and the usual
      fix is to switch to reflection. Name the origins you accept.
    pattern-either:
      - pattern: '{..., origin: true, ..., credentials: true, ...}'
      - pattern: '{..., credentials: true, ..., origin: true, ...}'
      - pattern: '{..., origin: ($O, $CB) => $CB(null, true), ..., credentials: true, ...}'
      - pattern: '{..., credentials: true, ..., origin: ($O, $CB) => $CB(null, true), ...}'
      - pattern: '{..., origin: "*", ..., credentials: true, ...}'
      - pattern: '{..., credentials: true, ..., origin: "*", ...}'

  - id: model-output-into-sink
    languages: [javascript, typescript]
    severity: ERROR
    mode: taint
    message: >-
      A model's response reaches a query, a shell command, raw HTML or eval without being
      validated. Whoever can influence the prompt — a user message, a retrieved document, a page
      the app fetched — can influence what runs. Treat the response as untrusted input: parse it
      into a shape you defined, or map it onto an allowlist of actions, before it reaches anything
      with an effect.
    pattern-sources:
      - pattern-either:
          - pattern: await $C.chat.completions.create(...)
          - pattern: await $C.messages.create(...)
          - pattern: await $C.responses.create(...)
          - pattern: await generateText(...)
          - pattern: await generateObject(...)
    pattern-sanitizers:
      # A schema the app defined. JSON.parse, marked.parse and the like check no shape —
      # marked.parse turns the response into HTML.
      - patterns:
          - pattern-either:
              - pattern: $S.parse(...)
              - pattern: $S.safeParse(...)
              - pattern: $S.validate(...)
          - metavariable-regex:
              metavariable: $S
              regex: ^(?!(JSON|marked|path|url|URL|qs|querystring|Date|yaml|YAML|toml|TOML|csv|Papa|showdown|parse5|cheerio)$)
      # An allowlist: the response picks an entry, the app supplies the value.
      - patterns:
          - pattern: $TABLE[$K]
          - metavariable-regex:
              metavariable: $TABLE
              regex: ^[A-Z][A-Z0-9_]*$
      # HTML passed through a maintained sanitizer.
      - pattern-either:
          - pattern: DOMPurify.sanitize(...)
          - pattern: sanitizeHtml(...)
    pattern-sinks:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)
          - pattern: execSync(...)
          - pattern: $CP.exec(...)
          - pattern: $CP.execSync(...)
          # The query text, not its parameters: a bound parameter is the safe form.
          - patterns:
              - pattern-either:
                  - pattern: $DB.query($Q, ...)
                  - pattern: $DB.raw($Q, ...)
                  - pattern: $DB.$queryRawUnsafe($Q, ...)
                  - pattern: $DB.$executeRawUnsafe($Q, ...)
              - focus-metavariable: $Q
          - pattern: $EL.innerHTML = $V
          - pattern: $EL.outerHTML = $V
          - pattern: $EL.insertAdjacentHTML(...)
          - pattern: document.write(...)
          - patterns:
              - pattern-inside: "{..., __html: $V, ...}"
              - focus-metavariable: $V

  - id: model-output-into-sink-python
    languages: [python]
    severity: ERROR
    mode: taint
    message: >-
      A model's response reaches a shell command, a query or eval without being validated. Whoever
      can influence the prompt can influence what runs. Parse the response into a shape you defined,
      or map it onto an allowlist of actions, before it reaches anything with an effect.
    pattern-sources:
      - pattern-either:
          - pattern: $C.chat.completions.create(...)
          - pattern: $C.messages.create(...)
          - pattern: $C.responses.create(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: $S.model_validate(...)
          - pattern: $S.model_validate_json(...)
          - pattern: $S.parse_obj(...)
      - patterns:
          - pattern: $TABLE[$K]
          - metavariable-regex:
              metavariable: $TABLE
              regex: ^[A-Z][A-Z0-9_]*$
    pattern-sinks:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)
          - pattern: os.system(...)
          - pattern: subprocess.run(...)
          - pattern: subprocess.call(...)
          - pattern: subprocess.Popen(...)
          # The query text, not its parameters: a bound parameter is the safe form.
          - patterns:
              - pattern: $CUR.execute($Q, ...)
              - focus-metavariable: $Q
